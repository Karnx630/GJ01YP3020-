<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valve Shim Calculator</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin-top: 0;
            color: #222;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            font-size: 0.9em;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .result-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #e3f2fd;
            border: 2px solid #2196f3;
            border-radius: 8px;
            text-align: center;
        }
        .result-value {
            font-size: 2em;
            font-weight: bold;
            color: #1565c0;
        }
        .note {
            font-size: 0.8em;
            color: #666;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Shim Calculator</h2>
    
    <!-- Pre-filled with XPulse 210 typical intake target as a default -->
    <label for="targetClearance">Target Clearance (mm)</label>
    <input type="number" id="targetClearance" step="0.01" value="0.10" oninput="calculateShim()">

    <label for="measuredClearance">Measured Clearance (mm)</label>
    <input type="number" id="measuredClearance" step="0.01" placeholder="e.g., 0.80" oninput="calculateShim()">

    <label for="oldShim">Old Shim Thickness (mm)</label>
    <input type="number" id="oldShim" step="0.01" placeholder="e.g., 2.00" oninput="calculateShim()">

    <div class="result-box">
        <div>Required New Shim:</div>
        <div class="result-value" id="newShimResult">0.00 mm</div>
    </div>
    
    <div class="note">
        *If the calculated size falls between standard sizes (0.025mm or 0.05mm increments), always round to favor a slightly looser clearance.
    </div>
</div>

<script>
    function calculateShim() {
        // Get values from inputs
        const target = parseFloat(document.getElementById('targetClearance').value) || 0;
        const measured = parseFloat(document.getElementById('measuredClearance').value) || 0;
        const oldShim = parseFloat(document.getElementById('oldShim').value) || 0;

        // The Formula: Old Shim + (Measured Clearance - Target Clearance)
        let newShim = oldShim + (measured - target);

        // Display logic to handle empty fields smoothly
        const resultDisplay = document.getElementById('newShimResult');
        if (measured > 0 && oldShim > 0) {
            resultDisplay.textContent = newShim.toFixed(3) + " mm";
        } else {
            resultDisplay.textContent = "---";
        }
    }
</script>

</body>
</html>
